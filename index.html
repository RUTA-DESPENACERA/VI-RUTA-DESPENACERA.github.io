  <!-- Animación CSS -->
  <style>
    #page-main-content {
      transition: opacity 500ms ease, transform 500ms ease;
    }

    #page-main-content > div {
      transition: opacity 650ms ease, transform 650ms cubic-bezier(0.22, 0.8, 0.2, 1);
    }

    @media (min-width: 768px) and (prefers-reduced-motion: no-preference) {
      #event-logo {
        width: 92%;
        transition: width 520ms cubic-bezier(0.18, 0.9, 0.22, 1);
      }

      body.intro-desktop-running #hero-card {
        width: min(40rem, calc(100vw - 2rem));
        margin-left: auto;
        margin-right: auto;
        overflow: hidden;
        gap: 0;
        transform: translateX(0);
        transition: none;
      }

      body.intro-desktop-running #hero-logo-panel {
        width: 100%;
        max-width: none;
        transform: scale(1.03);
        transform-origin: center center;
        transition: none;
      }

      body.intro-desktop-running #event-logo {
        width: 100%;
      }

      body.intro-desktop-running #hero-routes {
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        transform: translateX(30px);
        pointer-events: none;
        transition: none;
      }

      body.intro-desktop-running.intro-desktop-shrink #hero-card {
        width: 32rem;
        transform: translateX(calc((32rem - min(72rem, calc(100vw - 2rem))) / 2));
        transition: width 520ms cubic-bezier(0.18, 0.9, 0.22, 1), transform 520ms cubic-bezier(0.18, 0.9, 0.22, 1);
      }

      body.intro-desktop-running.intro-desktop-shrink #hero-logo-panel {
        flex: 0 0 32rem;
        transform: scale(1);
        transition: transform 520ms cubic-bezier(0.18, 0.9, 0.22, 1), flex-basis 520ms cubic-bezier(0.18, 0.9, 0.22, 1);
      }

      body.intro-desktop-running.intro-desktop-shrink #event-logo {
        width: 92%;
      }

      body.intro-desktop-running.intro-desktop-expand #hero-card {
        width: min(72rem, calc(100vw - 2rem));
        gap: 1rem;
        transform: translateX(0);
        transition: width 560ms cubic-bezier(0.22, 0.8, 0.2, 1), gap 560ms cubic-bezier(0.22, 0.8, 0.2, 1), transform 560ms cubic-bezier(0.22, 0.8, 0.2, 1);
      }

      body.intro-desktop-running.intro-desktop-expand #hero-logo-panel {
        flex: 0 0 32rem;
        transform: scale(1);
        transition: transform 560ms cubic-bezier(0.22, 0.8, 0.2, 1), flex-basis 560ms cubic-bezier(0.22, 0.8, 0.2, 1);
      }

      body.intro-desktop-running.intro-desktop-expand #event-logo {
        width: 92%;
      }

      body.intro-desktop-running.intro-desktop-expand #hero-routes {
        max-width: 1800px;
        opacity: 1;
        transform: translateX(0);
        transition: max-width 560ms cubic-bezier(0.22, 0.8, 0.2, 1), opacity 360ms ease, transform 560ms cubic-bezier(0.22, 0.8, 0.2, 1);
      }

      body.intro-desktop-running #page-main-content {
        opacity: 0;
        transform: translateY(24px);
        pointer-events: none;
        transition: none;
      }

      body.intro-desktop-running #page-main-content > div {
        opacity: 0;
        transform: translateY(18px);
        transition: none;
      }

      body.intro-desktop-ready #page-main-content {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 500ms ease, transform 500ms ease;
      }

      body.intro-desktop-ready #page-main-content > div {
        opacity: 1;
        transform: translateY(0);
      }

      body.intro-desktop-ready #page-main-content > div:nth-child(2) {
        transition-delay: 120ms;
      }
    }

    .btn-gradient {
      background-color: #d67f36;
      background-image: linear-gradient(120deg, #d67f36 0%, #d67f36 50%, #eab04c 100%);
      background-size: 220% 220%;
      background-position: 0% 50%;
      transition: background-position 260ms ease, filter 260ms ease, box-shadow 260ms ease;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
    }

    .btn-gradient:hover {
      background-position: 100% 50%;
      filter: brightness(1.04);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.26);
    }

    .btn-gradient:active {
      filter: brightness(0.98);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
    }

    .btn-gradient:focus-visible {
      outline: 2px solid #1f2937;
      outline-offset: 2px;
    }

    @keyframes scroll {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); } /* mueve de izquierda a derecha */
    }
    .animate-scroll {
      display: flex;
      width: max-content;
      animation: scroll 40s linear infinite; /* ajusta velocidad */
      animation-play-state: paused;
    }

    body.intro-desktop-ready .animate-scroll {
      animation-play-state: running;
    }
  </style>

  <script>
    var isLocalPreview = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

    function loadWikilocMaps() {
      document.querySelectorAll('iframe[data-wikiloc-src]').forEach(function (frame) {
        if (frame.getAttribute('src') === 'about:blank') {
          frame.setAttribute('src', frame.getAttribute('data-wikiloc-src'));
        }
      });
    }

    window.addEventListener('load', function () {
      var desktop = window.matchMedia('(min-width: 768px)').matches;
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!desktop || reduceMotion) {
        document.body.classList.remove('intro-desktop-running');
        document.body.classList.add('intro-desktop-ready');
        if (!isLocalPreview) {
          loadWikilocMaps();
        }
        return;
      }

      // Fase 1: logo en cuadro blanco, estatico brevemente.
      window.setTimeout(function () {
        // Fase 2: el logo se reduce y se coloca a la izquierda.
        document.body.classList.add('intro-desktop-shrink');
      }, 180);

      window.setTimeout(function () {
        // Fase 3: su mismo fondo blanco se expande y aparecen las rutas.
        document.body.classList.add('intro-desktop-expand');
      }, 640);

      // Fase 4: aparece el resto de la pagina.
      window.setTimeout(function () {
        document.body.classList.remove('intro-desktop-running', 'intro-desktop-shrink', 'intro-desktop-expand');
        document.body.classList.add('intro-desktop-ready');
        if (!isLocalPreview) {
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(loadWikilocMaps);
          });
        }
      }, 1200);
    });

    // En la previsualizacion local de VS Code, Wikiloc puede bloquear iframes.
    // Mostramos una captura estatica clicable para mantener la misma maquetacion.
    if (isLocalPreview) {
      document.querySelectorAll('iframe[data-local-preview]').forEach(function (frame) {
        var preview = frame.getAttribute('data-local-preview');
        var routeUrl = frame.getAttribute('data-route-url') || '#';
        var link = document.createElement('a');
        link.href = routeUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.className = 'block w-full h-full';

        var img = document.createElement('img');
        img.src = preview;
        img.alt = frame.title;
        img.className = 'w-full h-full object-cover';
        img.loading = 'lazy';

        link.appendChild(img);
        frame.replaceWith(link);
      });
    }
  </script>
